# Docker Compose 配置示例

version: '3.8'

services:
  assistantcard:
    image: assistantcard:v1.0.2
    container_name: assistantcard
    restart: always
    ports:
      - "4173:4173"
    environment:
      # Supabase 配置（示例值，请在实际部署时替换）
      VITE_SUPABASE_URL: "https://YOUR_SUPABASE_PROJECT.supabase.co"
      VITE_SUPABASE_ANON_KEY: "YOUR_SUPABASE_ANON_KEY"

      # Chat API 配置（示例值，请在实际部署时替换）
      VITE_CHAT_API_URL: "https://YOUR_DIFY_OR_BACKEND_DOMAIN/v1/chat-messages"
      VITE_CHAT_API_TOKEN: "YOUR_CHAT_API_TOKEN"

      # Related Questions API 配置（示例值，请在实际部署时替换）
      VITE_RELATED_QUESTIONS_API_URL: "https://YOUR_DIFY_OR_BACKEND_DOMAIN/v1/chat-messages"
      VITE_RELATED_QUESTIONS_API_TOKEN: "YOUR_RELATED_QUESTIONS_API_TOKEN"

      # Document Summary API 配置（示例值，请在实际部署时替换）
      VITE_DOCUMENT_SUMMARY_API_URL: "https://YOUR_DIFY_OR_BACKEND_DOMAIN/v1/chat-messages"
      VITE_DOCUMENT_SUMMARY_API_TOKEN: "YOUR_DOCUMENT_SUMMARY_API_TOKEN"
    networks:
      - net-dev

networks:
  net-dev:
    external: true
